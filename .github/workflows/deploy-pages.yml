name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: |
          REPO="${{ github.event.repository.name }}"
          # Custom domain (CNAME) and *.github.io user sites are served from /
          if [[ -f client/public/CNAME ]] || [[ "$REPO" == *".github.io" ]]; then
            export VITE_BASE_PATH="/"
          else
            export VITE_BASE_PATH="/${REPO}/"
          fi
          echo "Building with base: ${VITE_BASE_PATH}"
          pnpm run build:pages
          echo "--- index.html asset refs ---"
          grep -E 'src=|href=' dist/public/index.html

      - name: Verify asset paths match base
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ -f client/public/CNAME ]] || [[ "$REPO" == *".github.io" ]]; then
            if ! grep -q 'href="/assets/' dist/public/index.html || ! grep -q 'src="/assets/' dist/public/index.html; then
              echo "ERROR: expected root /assets/ paths for custom domain or user Pages site"
              exit 1
            fi
          else
            if ! grep -q "/${REPO}/assets/" dist/public/index.html; then
              echo "ERROR: index.html is missing /${REPO}/assets/ paths"
              exit 1
            fi
          fi

      - name: Add SPA fallback for client-side routes
        run: cp dist/public/index.html dist/public/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
